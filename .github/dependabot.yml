version: 2
updates:
  - package-ecosystem: npm
    directory: /src/20250907-clojure-mcp/sample/aws-knowledge-mcp/cdk
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
