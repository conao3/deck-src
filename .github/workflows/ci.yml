name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  clojure-mcp-sample:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/20250907-clojure-mcp/sample/clojure-mcp
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
          clj-kondo: latest

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            src/20250907-clojure-mcp/sample/clojure-mcp/.cpcache
          key: ${{ runner.os }}-clojure-${{ hashFiles('src/20250907-clojure-mcp/sample/clojure-mcp/deps.edn') }}
          restore-keys: ${{ runner.os }}-clojure-

      - name: Lint
        run: make lint

      - name: Test
        run: make test
